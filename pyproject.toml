[project]
name = "janus-print"
version = "0.1.0"
description = "Print DLP — inspect documents at the CUPS spooler, hold on policy match, alert Janus SIEM"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "boto3>=1.35",
    "redis>=5.2",
    "rq>=2.0",
    "pypdfium2>=4.30",
    "pdfminer.six>=20240706",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "reportlab>=4.2",
]

[project.scripts]
janus-print-api = "janusprint.api.app:main"
janus-print-worker = "janusprint.worker:main"
janus-print-rules = "janusprint.inspector.rules:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
janusprint = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
