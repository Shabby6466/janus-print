# Financial identifiers.
#
# Every rule carries fixtures. `janus-print-rules test` runs them, pytest runs them, and
# /api/v1/rules/reload refuses a reload that regresses them. A rule without negatives is a
# rule nobody has pressure-tested — the negatives here are the realistic false positives:
# invoice numbers, part numbers, order references.

rules:
  - id: pan-primary
    name: Payment card number
    description: >
      16-digit PAN for the major schemes, Luhn-checked. Without the checksum this rule
      fires on invoice and order numbers constantly.
    pattern: '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b'
    validator: luhn
    severity: 8
    action: hold
    threshold: 0.75
    min_count: 1
    tags: [pci, financial]
    context:
      terms: [visa, mastercard, amex, card, cvv, cvc, expiry, exp, cardholder]
      boost: 0.3
      window: 60
    fixtures:
      positive:
        - "Cardholder: J Smith  Card 4111111111111111  exp 04/28"
        - "Refund issued to 5555555555554444"
        - "Payment received 378282246310005 amex"
      negative:
        - "Invoice 4111111111111112 dated 3 March"      # fails Luhn
        - "Part number 1234567890123456 qty 4"          # fails Luhn
        - "Order reference 9999999999999999"            # fails Luhn

  - id: pan-spaced
    name: Payment card number, separated
    description: Cards written with spaces or dashes between groups.
    pattern: '\b(?:\d{4}[ -]){3}\d{4}\b'
    validator: luhn
    severity: 8
    action: hold
    threshold: 0.85
    min_count: 1
    tags: [pci, financial]
    context:
      terms: [card, visa, mastercard, payment, cvv, cardholder]
      boost: 0.3
      required: true
    fixtures:
      positive:
        - "Card: 4111-1111-1111-1111 cvv 123"
      negative:
        - "Serial 1234 5678 9012 3456 on the chassis plate"
        - "Grid ref 4111 1111 1111 1111 in the survey table"   # no context term

  - id: iban
    name: IBAN
    pattern: '\b[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}\b'
    validator: iban
    severity: 7
    action: hold
    threshold: 0.85
    tags: [financial, gdpr]
    context:
      terms: [iban, bank, account, transfer, swift, bic, payment]
      boost: 0.15
    fixtures:
      positive:
        - "Bank transfer to IBAN GB82WEST12345698765432"
        - "Account: DE89370400440532013000"
      negative:
        - "Reference GB99WEST12345698765432 is not valid"
        - "Document ID AB12CDEFGHIJKLMNOP"

  - id: swift-bic
    name: SWIFT/BIC code
    pattern: '\b[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b'
    severity: 4
    action: log
    base_confidence: 0.5
    threshold: 0.75
    min_count: 2
    ignore_case: false
    tags: [financial]
    context:
      terms: [swift, bic, bank, wire, correspondent]
      boost: 0.3
      required: true
    fixtures:
      positive:
        - "SWIFT DEUTDEFF and BIC CHASUS33 for the wire"
      negative:
        - "The BOARDROOM and MEETINGS sections"
