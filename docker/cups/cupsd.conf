# Lab configuration only. Wide-open admin access is fine on an isolated compose network
# and completely unacceptable anywhere else.
LogLevel info
MaxLogSize 0
ErrorPolicy retry-job
PreserveJobHistory Yes
PreserveJobFiles 86400

Listen 0.0.0.0:631
Listen /run/cups/cups.sock

# CUPS validates the HTTP Host: header against its own name and rejects anything else with
# a 400 — which the client reports, misleadingly, as "add '/version=1.1' to server name".
# Containers are reached by service name, so the alias is required here.
# In production, list the print server's real names instead of a wildcard.
ServerAlias *

Browsing Off
DefaultAuthType Basic
WebInterface Yes

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-Jobs CUPS-Move-Job CUPS-Get-Document Cancel-Job CUPS-Authenticate-Job>
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
